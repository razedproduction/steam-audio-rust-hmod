[mod]
id = "steam_audio"
version = "0.9.1"

[compatibility]
# Nightly 2026-11-08 (tag nightly-source/2026-11-08-fdc87ae).
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# `horizon_client_render::audio::steam_audio`: the mod's output stream, its Steam Audio rendering of Horizon's
# mixer and the world's acoustics (see the top of output.rs). Public for the frame hook in horizon-client.
[[module]]
id = "output"
file = "crates/horizon-client-render/src/audio.rs"
name = "steam_audio"
source = "output.rs"
visibility = "pub"

# At each camera update, take the sound output over (once per output Horizon opens).
[[injection]]
id = "take-over-output"
kind = "HEAD"
target = "horizon_client_render::audio::Audio::set_listener"
helper = "listener.rs"
bindings = [{ name = "audio", ty = "&mut Audio", value = "&mut *self" }]

# Once a frame: the kept settings (first time), the occlusion of the playing sources, their paths around walls and
# the reverb of the camera's surroundings, from the blocks.
[[injection]]
id = "acoustics"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# The settings page in Options > Mods: the mod's row, its buttons' labels, and their clicks.
[[injection]]
id = "mod-row"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "mods.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mods", ty = "&mut Vec<NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings-page"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings-click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "settings_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# The settings page's block search, typed on the page: each key while it is typed, and the page asked for its labels
# again.
[[injection]]
id = "settings-search"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# The visual debug mode (`steam_audio_hmod::debug`, each layer a button of the settings page): its world layers over
# the frame once the world is drawn, its labels and statistics panel on the HUD.
[[injection]]
id = "debug-world"
hook = "world_drawn"
hook_version = 1
kind = "HEAD"
helper = "world_drawn.rs"
bindings = [{ name = "world", ty = "&mut WorldDrawn<'_>", value = "&mut *world" }]

[[injection]]
id = "debug-hud"
hook = "hud"
hook_version = 1
kind = "HEAD"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut Corners", value = "&mut *corners" },
]

# steam-audio-rust, vendored, plus the renderer (`steam_audio_hmod::horizon`).
[[crate]]
id = "engine"
path = "engine"
dependent = "horizon-client-render"
